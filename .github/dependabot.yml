# Dependabot: PR nâng dependency hằng tuần, gộp nhóm để bớt nhiễu. PR phải qua CI như mọi PR khác.
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.DEPENDABOT_PACKAGES_TOKEN }} # Secret Dependabot cấp org (PAT chỉ có read:packages) — xem docs/05
updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    open-pull-requests-limit: 10
    commit-message: { prefix: build, include: scope }
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "08:00", timezone: Asia/Ho_Chi_Minh }
    groups:
      github-actions: { patterns: ["*"] }
    commit-message: { prefix: ci }
